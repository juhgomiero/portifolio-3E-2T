<!DOCTYPE html> <!--o Doctype indica a linguagem de programacao que esta sendo usado-->
<html lang="pt-br"> <!--inicio do codigo-->
<head> <!--inicio do cabecaalho do documento. dentro dessa tag pode ser inseridas folhas de estilo e  script-->
    <meta charset="UTF-8"> <!--indica qual sera os caracteres (character set or charset) sera utilizado para renderizar o texto da pagina-->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portifolio</title> <!--titulo do projeto-->
    <link rel="stylesheet" href="style.css">
</head> <!--fim do cabecalho do documento-->
<body> <!--nesse espaco esta o conteudo visual da pagina. As tags que representam o texto, botoes e outros devem ser adicinados nesse intervalo-->
    <!--um documento HTML e composto por tags que sao escritas entre < >. As tags precisam ser abertas e fehadas o que diferenciam e que as tags de fechamento possuem \ antes do nome. Alguns codigos nao precisam da <\> para fechamento, apenas da barra, como o caso da tag meta-->
    <!--No HTML ha seis niveis de cabecalho\titulos que podem ser usados por meios das tag h1,h2,h3,h4,h5 e h6, sendo h1 o maior e mais relevante e o h6 o menor\ menos relevante-->
<h1>Portifolio</h1>
<h2>Programacao</h2>
<h3>HTML</h3>
<h4>CSS</h4>
<h5>JS</h5>
<h6>matematica</h6>
<!--Paragrafo de texto sao gerados em HTML por meio de tag <P><P\>, esse e um exemplo de tag cuja  disposicao na tela se da em forma de bloco-->
<p> Serve para colocar paragrafos no projeto, sao os textos aparecem no site</p>
<p> Segundo paragrafo</p>

<p> align="center">
<img src="img|/images.png" alt="Sans" srcset="" width="250">
</p>
</body><!--fechamento da tag-->
</html> <!--fim do codigo-->
